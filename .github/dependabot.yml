version: 2
updates:
  # Keep the SHA-pinned third-party actions in the reusable workflows current.
  # Dependabot opens a reviewed PR when a newer release moves the pinned SHA.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Wait a week after a release before proposing it, and batch minor/patch bumps into one PR
    # (majors stay separate): fewer PRs to review and fewer manual `v1` moves.
    cooldown:
      default-days: 7
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(deps)"
